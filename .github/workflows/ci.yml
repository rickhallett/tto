name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - name: End-to-end (unprivileged, TTO_PREFIX)
        run: sh tests/e2e.sh
      - run: cargo build --release
      - name: Bundle builds
        run: |
          scripts/bundle-app.sh target/release/tto 0.0.0 dist
          plutil -lint "dist/Turn Them Off.app/Contents/Info.plist"
